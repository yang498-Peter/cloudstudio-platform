<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudStudio Gaussian Viewer</title>
  <style>
    :root {
      --bg: #0b0b0d;
      --surface: rgba(18,18,24,0.92);
      --border: rgba(255,255,255,0.12);
      --text: #f5f7fb;
      --muted: #a7b0bd;
      --accent: #ffb547;
      --danger: #ff7b72;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; }
    #app { position: relative; width: 100%; height: 100%; overflow: hidden; }
    #viewer { position: absolute; inset: 0; }
    .hud {
      position: absolute;
      top: 18px;
      left: 18px;
      max-width: min(520px, calc(100vw - 36px));
      padding: 10px 12px;
      border-radius: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      backdrop-filter: blur(10px);
      z-index: 10;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      transition: opacity .18s ease, transform .18s ease;
    }
    .hud-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .hud-toggle {
      appearance: none;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      min-width: 28px;
      min-height: 28px;
      line-height: 1;
    }
    .hud-body {
      margin-top: 10px;
    }
    .hud.is-collapsed {
      padding: 6px;
      width: 42px;
      max-width: 42px;
      border-radius: 999px;
    }
    .hud.is-collapsed .hud-body,
    .hud.is-collapsed .title {
      display: none;
    }
    .hud.is-collapsed .hud-head {
      justify-content: center;
    }
    .title { font-size: 14px; font-weight: 700; margin: 0; }
    .meta { font-size: 12px; line-height: 1.6; color: var(--muted); word-break: break-all; }
    .progress {
      margin-top: 10px;
    }
    .progress-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .progress-track {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .progress-fill {
      width: 8%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ffb547, #ffd27d);
      transition: width .24s ease;
    }
    .warn { margin-top: 10px; color: var(--accent); }
    .error { margin-top: 10px; color: var(--danger); white-space: pre-wrap; }
    .back {
      display: inline-flex; align-items: center; gap: 8px; margin-top: 12px;
      color: var(--text); text-decoration: none; font-size: 12px; border: 1px solid var(--border);
      padding: 8px 10px; border-radius: 10px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="viewer"></div>
    <div class="hud is-collapsed" id="sceneHud">
      <div class="hud-head">
        <div class="title" id="sceneTitle">Gaussian Scene</div>
        <button class="hud-toggle" id="hudToggleBtn" type="button">Expand</button>
      </div>
      <div class="hud-body">
        <div class="meta" id="sceneMeta">Loading…</div>
        <div class="progress" id="sceneProgressWrap">
          <div class="progress-label">
            <span id="sceneProgressText">Loading scene…</span>
            <span id="sceneProgressPct">10%</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="sceneProgressFill"></div>
          </div>
        </div>
        <div class="warn" id="sceneWarn"></div>
        <div class="error" id="sceneError"></div>
        <a class="back" href="/">← Back to CloudStudio</a>
      </div>
    </div>
  </div>

  <script type="module">
    import * as GaussianSplats3D from 'https://esm.sh/@mkkellogg/gaussian-splats-3d';
    window.__GAUSSIAN_SPLATS_3D__ = GaussianSplats3D;

    const params = new URLSearchParams(window.location.search);
    const src = params.get('src');
    const name = params.get('name') || 'Gaussian Scene';
    const titleEl = document.getElementById('sceneTitle');
    const metaEl = document.getElementById('sceneMeta');
    const warnEl = document.getElementById('sceneWarn');
    const errorEl = document.getElementById('sceneError');
    const hudEl = document.getElementById('sceneHud');
    const hudToggleBtn = document.getElementById('hudToggleBtn');
    const progressWrapEl = document.getElementById('sceneProgressWrap');
    const progressTextEl = document.getElementById('sceneProgressText');
    const progressPctEl = document.getElementById('sceneProgressPct');
    const progressFillEl = document.getElementById('sceneProgressFill');
    const setHudCollapsed = collapsed => {
      hudEl.classList.toggle('is-collapsed', collapsed);
      hudToggleBtn.textContent = collapsed ? '≡' : 'Minimize';
      hudToggleBtn.title = collapsed ? 'Expand info panel' : 'Minimize info panel';
    };
    const setProgress = (pct, label) => {
      const safePct = Math.max(0, Math.min(100, Number(pct) || 0));
      progressFillEl.style.width = `${safePct}%`;
      progressPctEl.textContent = `${Math.round(safePct)}%`;
      if (label) progressTextEl.textContent = label;
    };
    hudToggleBtn.addEventListener('click', () => {
      setHudCollapsed(!hudEl.classList.contains('is-collapsed'));
    });
    setHudCollapsed(true);
    titleEl.textContent = name;

    if (!src) {
      errorEl.textContent = 'Missing src query parameter.';
      metaEl.textContent = 'No Gaussian asset URL was provided.';
      throw new Error('Missing src query parameter');
    }

    const ext = (src.split('.').pop() || '').toLowerCase();
    metaEl.textContent = `Source: ${src}`;
    if (ext === 'ply') {
      warnEl.textContent = 'PLY support depends on the uploaded file matching a Gaussian splat PLY layout supported by GaussianSplats3D. If this scene fails, convert it to .splat or .ksplat first.';
    }

    metaEl.textContent = `Loading: ${src}`;
    setHudCollapsed(false);
    setProgress(0, 'Initializing viewer…');

    async function start() {
      try {
        const root = document.getElementById('viewer');
        const viewer = new GaussianSplats3D.Viewer({
          rootElement: root,
          cameraUp: [0, 0, 1],
          sharedMemoryForWorkers: false,
          antialiased: true,
        });

        await viewer.addSplatScene(src, {
          splatAlphaRemovalThreshold: 5,
          showLoadingUI: true,
          progressiveLoad: true,
          onProgress: (progress, label, stage) => {
            const pct = Number.isFinite(progress) ? progress : 0;
            const stageText = stage ? String(stage) : '';
            const uiLabel = label || (stageText ? `Loading (${stageText})…` : 'Loading scene…');
            setProgress(pct, uiLabel);
          },
        });

        await viewer.start();
        setProgress(100, 'Scene ready');
        metaEl.textContent = `Loaded: ${src}`;
        setTimeout(() => {
          progressWrapEl.style.display = 'none';
          setHudCollapsed(true);
        }, 1200);
      } catch (error) {
        console.error('[GaussianViewer] Failed to load scene:', error);
        setProgress(100, 'Load failed');
        errorEl.textContent = `Failed to load Gaussian scene.\n${error?.message || error}`;
        setHudCollapsed(false);
      }
    }

    start();
  </script>
</body>
</html>
