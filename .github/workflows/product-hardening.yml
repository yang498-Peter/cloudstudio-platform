name: Product Hardening

on:
  pull_request:
    branches:
      - main
      - audit/product-hardening
  push:
    branches:
      - main
      - audit/product-hardening

jobs:
  core-checks:
    name: Core checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-uploader
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-uploader/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Python test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy==2.0.2 laspy==2.6.1 scipy==1.13.1 matplotlib==3.8.4 reportlab==4.4.10 Pillow==11.3.0 lazrs==0.8.1

      - name: Check i18n
        run: npm run check:i18n

      - name: Check deploy docs
        run: npm run check:deploy-docs

      - name: Run unit tests
        run: |
          npm run test:runtime-storage
          npm run test:static-runtime
          npm run test:long-jobs
          npm run test:public-api-sanitize
          npm run test:dxf-draw
          npm run test:volume
          npm run test:floorplan

  viewer-smoke:
    name: Viewer browser smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-uploader
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-uploader/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Potree browser bundle
        run: |
          cd ../potree
          npm ci
          npm run build

      - name: Install Playwright for smoke tests
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run viewer smoke tests
        run: npm run test:viewer-smoke
